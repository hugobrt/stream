<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1119">
<title>Salon</title>
<style>
:root{--bg:#0f1119;--panel:#171a27;--panel2:#1f2336;--line:#2b3048;--text:#ecebf5;--muted:#8d92ad;--accent:#ffb347;--ok:#5ce1c0;--bad:#ff7a7a;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:42px}
button:hover{border-color:var(--accent)}
button.main{background:var(--accent);border-color:var(--accent);color:#2b1a00;font-weight:650}
button.stop{background:var(--bad);border-color:var(--bad);color:#2b0505;font-weight:650}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:42px;width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
#join{display:grid;place-items:center;height:100%;padding:24px;text-align:center}
#join h1{font-size:clamp(2.4rem,9vw,4rem);margin:0 0 8px;letter-spacing:-.03em}
#join p{color:var(--muted);margin:0 0 26px;max-width:30ch}
#join button{padding:14px 28px;font-size:1.05rem}
#app{display:none;height:100%;height:100dvh;grid-template-columns:1fr 370px;grid-template-rows:auto 1fr;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{grid-column:1/-1;display:flex;gap:10px;align-items:center;padding:12px 16px}
header b{font-size:1.15rem;letter-spacing:-.02em;margin-right:auto}
#pill{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 12px}
#pill i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
#pill.on{color:var(--text)}#pill.on i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
header button{min-height:36px;padding:6px 12px}
main{padding:0 8px 16px 16px;min-height:0;display:flex}
#stage{position:relative;flex:1;border-radius:var(--r);background:#000;overflow:hidden;display:grid;place-items:center;min-height:0;isolation:isolate}
#glowwrap{position:absolute;inset:-40px;z-index:-1;pointer-events:none}
#glow{width:100%;height:100%;object-fit:cover;filter:blur(60px) saturate(1.7);opacity:.45}
#remote,#player{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#player{display:none}
#empty{position:relative;text-align:center;color:var(--muted);padding:24px;max-width:34ch}
#empty b{display:block;color:var(--text);font-size:1.1rem;margin-bottom:4px}
#stats{position:absolute;left:12px;top:12px;background:#000b;color:var(--ok);padding:4px 9px;border-radius:8px;font-size:12px;display:none}
#local{position:absolute;right:12px;top:12px;width:min(22%,200px);border:1px solid var(--line);border-radius:10px;background:#000;display:none}
#fs{position:absolute;right:12px;bottom:12px;background:#000b;min-height:36px;padding:6px 12px}
#side{display:flex;flex-direction:column;min-height:0;padding:0 16px 16px 8px;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;min-height:36px}
.seg button.on{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--accent)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:grid;gap:5px;color:var(--muted);font-size:13px}
label.f b{color:var(--text)}
#note{font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:8px 10px;display:none}
.check{display:flex;gap:8px;align-items:center;color:var(--muted)}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.stack{display:grid;gap:12px}
.jbox{display:grid;gap:14px;width:min(360px,100%);text-align:left}
.jbox h1,.jbox p{text-align:center;margin:0}
#jerr{color:var(--bad);min-height:1.4em;font-size:14px}
header b small{color:var(--muted);font-weight:400;font-size:13px;margin-left:4px}
header b{margin-right:0}#pill{margin-right:auto}
#over{display:none;position:fixed;inset:0;z-index:10;background:var(--bg);place-items:center;text-align:center;padding:24px}
#over h2{margin:0 0 18px}
#chat{flex:1;min-height:0;display:flex;flex-direction:column;padding:0;gap:0;overflow:hidden}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
#msgs div{background:var(--panel2);padding:7px 11px;border-radius:14px 14px 14px 4px;max-width:88%;word-wrap:break-word}
#msgs .me{align-self:flex-end;background:#4a3515;border-radius:14px 14px 4px 14px}
#msgs .sys{background:transparent;color:var(--muted);font-size:13px;padding:2px 4px}
#chatform{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
#tabs{display:none}
@media(min-width:900px){#glowwrap{display:block}}
@media(max-width:520px){header b{display:none}header{gap:6px}}
@media(max-width:899px){
  #glowwrap{display:none}
  #app{grid-template-columns:1fr;grid-template-rows:auto auto auto 1fr}
  main{padding:0}
  #stage{border-radius:0;aspect-ratio:16/9;flex:none;width:100%}
  header{padding:8px 12px}
  #tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
  #tabs button{border:0;border-radius:0;background:transparent;border-bottom:2px solid transparent;min-height:46px}
  #tabs button.on{border-bottom-color:var(--accent);color:var(--accent)}
  #side{padding:12px;overflow:auto}
  #side[data-tab="chat"] #ctrl{display:none}
  #side[data-tab="ctrl"] #chat{display:none}
  #chat{min-height:55dvh}
  #local{width:90px}
  .badge{background:var(--accent);color:#2b1a00;border-radius:99px;font-size:12px;padding:1px 7px;margin-left:6px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="join"><div class="jbox">
  <h1>Salon</h1>
  <p>Regardez ensemble, chacun chez soi.</p>
  <div class="seg"><button id="jCreate">Créer</button><button id="jJoin">Rejoindre</button></div>
  <label class="f" id="codeRow">Code de la session<input type="text" id="jcode" autocomplete="off" autocapitalize="off" placeholder="ex. abc123"></label>
  <label class="f">Mot de passe (facultatif)<input type="text" id="jpin" autocomplete="off" placeholder="aucun"></label>
  <div class="seg"><button id="jWatch">Je regarde</button><button id="jShare">Je partage</button></div>
  <button class="main" id="jgo">Ouvrir la session</button>
  <div id="jerr"></div>
</div></div>

<div id="over"><div><h2 id="overMsg">Session terminée</h2><button class="main" id="overBtn">Retour</button></div></div>

<div id="app">
  <header>
    <b>Salon <small id="sess"></small></b>
    <span id="pill"><i></i><span id="status">En attente…</span></span>
    <button id="copy">Copier le lien</button><button id="end" class="stop">Terminer</button>
  </header>

  <main>
    <section id="stage">
      <div id="glowwrap"><video id="glow" autoplay muted playsinline></video></div>
      <video id="remote" autoplay playsinline></video>
      <video id="player" controls playsinline></video>
      <div id="empty"><b>Rien n’est partagé</b>Quand l’autre personne partage, ça s’affiche ici.</div>
      <div id="stats"></div>
      <video id="local" autoplay playsinline muted></video>
      <button id="fs">Plein écran</button>
    </section>
  </main>

  <nav id="tabs"><button id="tabCtrl" class="on">Partage</button><button id="tabChat">Chat<span id="badge" class="badge" hidden>0</span></button></nav>

  <aside id="side" data-tab="ctrl">
    <div class="card" id="ctrl">
      <div class="seg" id="roleSeg"><button id="roleWatch">Je regarde</button><button id="roleShare">Je partage</button></div>
      <div class="stack" id="shareCtl">
        <div class="seg">
          <button id="srcScreen">Écran</button>
          <button id="srcFile">Fichier vidéo</button>
        </div>
        <div id="note"></div>
        <div class="grid2" id="resfps">
          <label class="f">Résolution
            <select id="res"><option value="1280x720">720p</option><option value="1920x1080" selected>1080p</option><option value="2560x1440">1440p</option><option value="3840x2160">4K</option></select>
          </label>
          <label class="f">Images/seconde
            <select id="fps"><option>15</option><option>30</option><option selected>60</option></select>
          </label>
        </div>
        <label class="f">Priorité
          <select id="hint"><option value="motion" selected>Fluidité (films, jeux)</option><option value="detail">Netteté (images fixes)</option><option value="text">Texte</option></select>
        </label>
        <label class="f">Débit vidéo : <b><span id="brv">8</span> Mb/s</b>
          <input type="range" id="br" min="1" max="50" value="8">
        </label>
        <label class="check" id="audRow"><input type="checkbox" id="aud" checked> Partager le son</label>
        <button class="main" id="share">Partager l’écran</button>
      </div>
      <button id="mic">Micro</button>
      <input type="file" id="file" accept="video/*" hidden>
    </div>

    <div class="card" id="chat">
      <div id="msgs"></div>
      <form id="chatform"><input type="text" id="msg" placeholder="Écrire un message" autocomplete="off"><button>Envoyer</button></form>
    </div>
  </aside>
</div>

<script>
const $ = (id) => document.getElementById(id);
const canScreen = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);
let room = new URLSearchParams(location.search).get("room") || "", pin = "", isHost = false, active = false, ended = false;

let ws, pc, polite = false, makingOffer = false, ignoreOffer = false;
let screenStream = null, micTrack = null, senders = {}, mode = canScreen ? "screen" : "file", unread = 0;
const send = (o) => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));
const setStatus = (t, on) => { $("status").textContent = t; $("pill").className = on ? "on" : ""; };

/* ---------- Interface ---------- */
function setMode(m) {
  mode = m;
  $("srcScreen").classList.toggle("on", m === "screen");
  $("srcFile").classList.toggle("on", m === "file");
  $("share").textContent = screenStream ? "Arrêter" : m === "screen" ? "Partager l’écran" : "Choisir un film";
  $("resfps").style.opacity = m === "file" ? .45 : 1;
  const n = $("note");
  n.style.display = !canScreen || m === "file" ? "block" : "none";
  n.textContent = !canScreen
    ? "Le partage d’écran n’existe pas dans les navigateurs de téléphone. Choisis un film stocké sur ton téléphone (mp4 conseillé)."
    : "Le film garde sa résolution d’origine. Le débit et la priorité restent réglables.";
}
$("srcScreen").disabled = !canScreen;
$("srcScreen").onclick = () => !screenStream && setMode("screen");
$("srcFile").onclick = () => !screenStream && setMode("file");
setMode(mode);

function tab(t) {
  $("side").dataset.tab = t;
  $("tabCtrl").classList.toggle("on", t === "ctrl");
  $("tabChat").classList.toggle("on", t === "chat");
  if (t === "chat") { unread = 0; $("badge").hidden = true; $("msgs").scrollTop = 1e9; }
}
$("tabCtrl").onclick = () => tab("ctrl");
$("tabChat").onclick = () => tab("chat");

let role = "watch";
function setRole(r, announce) {
  role = r;
  if (r === "watch" && screenStream) stopShare();
  $("roleWatch").classList.toggle("on", r === "watch");
  $("roleShare").classList.toggle("on", r === "share");
  $("shareCtl").style.display = r === "share" ? "grid" : "none";
  if (announce) send({ type: "role", role: r });
}
$("roleWatch").onclick = () => setRole("watch", true);
$("roleShare").onclick = () => setRole("share", true);
let jmode = room ? "join" : "create", jrole = "watch";
function setJ() {
  $("jCreate").classList.toggle("on", jmode === "create"); $("jJoin").classList.toggle("on", jmode === "join");
  $("jWatch").classList.toggle("on", jrole === "watch"); $("jShare").classList.toggle("on", jrole === "share");
  $("codeRow").style.display = jmode === "join" ? "grid" : "none";
  $("jgo").textContent = jmode === "join" ? "Rejoindre" : "Ouvrir la session";
}
$("jCreate").onclick = () => { jmode = "create"; setJ(); };
$("jJoin").onclick = () => { jmode = "join"; setJ(); };
$("jWatch").onclick = () => { jrole = "watch"; setJ(); };
$("jShare").onclick = () => { jrole = "share"; setJ(); };
$("jcode").value = room; setJ();
$("jgo").onclick = () => {
  isHost = jmode === "create";
  room = isHost ? Math.random().toString(36).slice(2, 8) : $("jcode").value.trim();
  if (!room) return ($("jerr").textContent = "Entre le code de la session.");
  pin = $("jpin").value.trim();
  $("jerr").textContent = ""; $("jgo").disabled = true;
  setRole(jrole, false); connect();
};
function endSession(text) {
  ended = true;
  try { stopShare(); if (micTrack) micTrack.stop(); if (pc) pc.close(); if (ws) ws.close(); } catch {}
  $("overMsg").textContent = text; $("over").style.display = "grid";
}
$("overBtn").onclick = () => (location.href = location.pathname);
$("end").onclick = () => (isHost ? send({ type: "close" }) : endSession("Tu as quitté la session."));

/* ---------- Signalisation ---------- */
function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host);
  ws.onopen = () => send({ type: isHost ? "create" : "join", room, pin });
  ws.onclose = () => {
    if (ended) return;
    if (active) { setStatus("Reconnexion…"); setTimeout(connect, 2000); }
    else { $("jgo").disabled = false; if (!$("jerr").textContent) $("jerr").textContent = "Connexion impossible. Le serveur met parfois une minute à se réveiller : réessaie."; }
  };
  ws.onmessage = async ({ data }) => {
    const m = JSON.parse(data);
    if (m.type === "error") {
      const txt = { nosession: "Aucune session ouverte avec ce code. Demande à l’hôte de la créer.", badpin: "Mot de passe incorrect.", full: "La session a déjà deux personnes.", exists: "Ce code est déjà utilisé." }[m.code] || "Erreur.";
      if (active && (m.code === "full" || m.code === "exists")) return ws.close();
      if (active) return endSession("La session n’est plus disponible.");
      $("jerr").textContent = txt; return ws.close();
    }
    if (m.type === "closed") return endSession("La session est terminée.");
    if (m.type === "joined") {
      if (!active) {
        active = true;
        $("join").style.display = "none"; $("app").style.display = "grid";
        history.replaceState(null, "", "?room=" + encodeURIComponent(room));
        $("sess").textContent = room; $("end").textContent = isHost ? "Terminer" : "Quitter";
        if (!isHost) $("end").className = "";
      }
      polite = m.polite; send({ type: "role", role, init: true }); createPC(); setStatus(polite ? "Connexion…" : "En attente de l’autre personne…"); }
    if (m.type === "peer-joined") { send({ type: "role", role, init: true }); setStatus("Connexion…"); if (!pc) createPC(); pc.getTransceivers().length ? negotiate() : kick(); }
    if (m.type === "peer-left") { setStatus("L’autre personne est partie"); resetRemote(); createPC(); }
    if (m.type === "role") {
      const opposite = m.role === "share" ? "watch" : "share";
      if (m.role === role && (!m.init || polite)) {
        setRole(opposite, false);
        addSys(m.role === "share" ? "L’autre personne partage : tu regardes." : "L’autre personne regarde : c’est toi qui partages.");
      }
    }
    if (m.type === "chat") addMsg(m.text, false);
    if (m.type === "description") await onDescription(m.description);
    if (m.type === "candidate") { try { await pc.addIceCandidate(m.candidate); } catch (e) { if (!ignoreOffer) console.warn(e); } }
  };
}

async function negotiate() {
  try { makingOffer = true; await pc.setLocalDescription(); send({ type: "description", description: pc.localDescription }); }
  catch (e) { console.error(e); } finally { makingOffer = false; }
}

function createPC() {
  if (pc) pc.close();
  senders = {};
  pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }, { urls: "stun:stun1.l.google.com:19302" }] });
  pc.onicecandidate = (e) => e.candidate && send({ type: "candidate", candidate: e.candidate });
  pc.onnegotiationneeded = negotiate;
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === "connected") setStatus("Connecté", true);
    if (pc.connectionState === "failed") setStatus("Connexion impossible (réseau trop restrictif)");
  };
  pc.onsignalingstatechange = () => { if (pc.signalingState === "stable") applyQuality(); };
  pc.ontrack = ({ track, streams }) => {
    const stream = streams[0];
    if (track.kind === "video") {
      $("remote").srcObject = stream; $("glow").srcObject = stream;
      $("empty").style.display = "none";
      track.onmute = () => { $("empty").style.display = "block"; $("stats").style.display = "none"; };
      track.onunmute = () => { $("empty").style.display = "none"; $("stats").style.display = "block"; };
    } else if (!stream.getVideoTracks().length) {
      let a = $("remoteMic");
      if (!a) { a = document.createElement("audio"); a.id = "remoteMic"; a.autoplay = true; document.body.appendChild(a); }
      a.srcObject = stream;
    }
  };
  if (screenStream) addScreenTracks();
  if (micTrack) senders.mic = pc.addTrack(micTrack, new MediaStream([micTrack]));
}

function kick() { if (!polite && pc.getTransceivers().length === 0) pc.addTransceiver("video", { direction: "recvonly" }); }

async function onDescription(desc) {
  const collision = desc.type === "offer" && (makingOffer || pc.signalingState !== "stable");
  ignoreOffer = !polite && collision;
  if (ignoreOffer) return;
  await pc.setRemoteDescription(desc);
  if (desc.type === "offer") { await pc.setLocalDescription(); send({ type: "description", description: pc.localDescription }); }
}

function resetRemote() { $("remote").srcObject = null; $("glow").srcObject = null; $("empty").style.display = "block"; $("stats").style.display = "none"; }

/* ---------- Partage ---------- */
function attach(kind, t, s) { if (!senders[kind]) senders[kind] = pc.addTrack(t, s); }
function addScreenTracks() {
  screenStream.getTracks().forEach((t) => attach(t.kind === "video" ? "video" : "audio", t, screenStream));
  screenStream.onaddtrack = (e) => attach(e.track.kind === "video" ? "video" : "audio", e.track, screenStream);
}
function sharingUI(on) {
  $("share").textContent = on ? "Arrêter" : mode === "screen" ? "Partager l’écran" : "Choisir un film";
  $("share").className = on ? "stop" : "main";
}

$("share").onclick = () => {
  if (screenStream) return stopShare();
  mode === "file" ? $("file").click() : shareScreen();
};

async function shareScreen() {
  const [w, h] = $("res").value.split("x").map(Number);
  try {
    screenStream = await navigator.mediaDevices.getDisplayMedia({
      video: { width: { ideal: w }, height: { ideal: h }, frameRate: { ideal: +$("fps").value } },
      audio: $("aud").checked ? { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 2 } : false,
      systemAudio: "include",
    });
  } catch (e) { screenStream = null; return addSys(e.name === "NotAllowedError" ? "Partage annulé." : "Partage impossible : " + e.message); }
  screenStream.getVideoTracks()[0].onended = stopShare;
  $("local").srcObject = screenStream; $("local").style.display = "block";
  if ($("aud").checked && !screenStream.getAudioTracks().length) addSys("Pas de son capturé : coche « Partager l’audio » dans la fenêtre du navigateur (Windows : écran entier ou onglet).");
  addScreenTracks(); sharingUI(true);
}

function shareFile(file) {
  const p = $("player");
  if (!(p.captureStream || p.mozCaptureStream)) return addSys("Ce navigateur ne peut pas diffuser un fichier.");
  p.src = URL.createObjectURL(file); p.style.display = "block"; sharingUI(true);
  p.addEventListener("playing", () => {
    if (screenStream) return;
    screenStream = p.captureStream ? p.captureStream() : p.mozCaptureStream();
    addScreenTracks(); applyQuality();
  }, { once: true });
  p.play().catch(() => addSys("Appuie sur lecture pour démarrer le film."));
  addSys("Astuce : mets des écouteurs pour éviter l’écho dans ton micro.");
}
$("file").onchange = (e) => { if (e.target.files[0]) shareFile(e.target.files[0]); e.target.value = ""; };

function stopShare() {
  if (screenStream) screenStream.getTracks().forEach((t) => t.stop());
  ["video", "audio"].forEach((k) => { if (senders[k]) { try { pc.removeTrack(senders[k]); } catch {} delete senders[k]; } });
  screenStream = null;
  const p = $("player"); p.pause(); p.removeAttribute("src"); p.load(); p.style.display = "none";
  $("local").style.display = "none"; sharingUI(false);
}

async function applyQuality() {
  if (!screenStream || !senders.video) return;
  const v = screenStream.getVideoTracks()[0]; if (!v) return;
  const fps = +$("fps").value, hint = $("hint").value;
  try { v.contentHint = hint; } catch {}
  if (mode === "screen") {
    const [w, h] = $("res").value.split("x").map(Number);
    try { await v.applyConstraints({ width: { ideal: w }, height: { ideal: h }, frameRate: { ideal: fps } }); } catch {}
  }
  try {
    const p = senders.video.getParameters();
    if (!p.encodings || !p.encodings.length) p.encodings = [{}];
    p.encodings[0].maxBitrate = $("br").value * 1e6;
    if (mode === "screen") p.encodings[0].maxFramerate = fps;
    p.encodings[0].scaleResolutionDownBy = 1;
    p.degradationPreference = hint === "motion" ? "maintain-framerate" : "maintain-resolution";
    await senders.video.setParameters(p);
    if (senders.audio) {
      const a = senders.audio.getParameters();
      if (a.encodings && a.encodings.length) { a.encodings[0].maxBitrate = 256000; await senders.audio.setParameters(a); }
    }
  } catch (e) { console.warn("setParameters", e); }
}
["res", "fps", "hint", "br"].forEach((id) => $(id).addEventListener("input", () => { $("brv").textContent = $("br").value; applyQuality(); }));

/* ---------- Micro ---------- */
$("mic").onclick = async () => {
  if (!micTrack) {
    try {
      const s = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
      micTrack = s.getAudioTracks()[0];
      senders.mic = pc.addTrack(micTrack, new MediaStream([micTrack]));
      $("mic").textContent = "Couper le micro";
    } catch { addSys("Micro refusé."); }
  } else { micTrack.enabled = !micTrack.enabled; $("mic").textContent = micTrack.enabled ? "Couper le micro" : "Micro"; }
};

/* ---------- Stats ---------- */
let last = { bytes: 0, t: 0 };
setInterval(async () => {
  if (!pc || pc.connectionState !== "connected") return;
  (await pc.getStats()).forEach((r) => {
    if (r.type === "inbound-rtp" && r.kind === "video" && r.frameWidth) {
      const dt = (r.timestamp - last.t) / 1000;
      const mbps = last.t ? ((r.bytesReceived - last.bytes) * 8) / dt / 1e6 : 0;
      last = { bytes: r.bytesReceived, t: r.timestamp };
      $("stats").textContent = `${r.frameWidth}×${r.frameHeight} · ${Math.round(r.framesPerSecond || 0)} fps · ${mbps.toFixed(1)} Mb/s`;
      $("stats").style.display = "block";
    }
  });
}, 1000);

/* ---------- Chat, lien, plein écran ---------- */
function push(t, cls) { const d = document.createElement("div"); d.textContent = t; if (cls) d.className = cls; $("msgs").appendChild(d); $("msgs").scrollTop = 1e9; }
function addMsg(t, me) {
  push(t, me ? "me" : "");
  if (!me && $("side").dataset.tab !== "chat" && getComputedStyle($("tabs")).display !== "none") { unread++; $("badge").textContent = unread; $("badge").hidden = false; }
}
const addSys = (t) => push(t, "sys");
$("chatform").onsubmit = (e) => { e.preventDefault(); const t = $("msg").value.trim(); if (!t) return; send({ type: "chat", text: t }); addMsg(t, true); $("msg").value = ""; };
$("copy").onclick = async () => { try { await navigator.clipboard.writeText(location.href); $("copy").textContent = "Lien copié"; } catch { $("copy").textContent = "Copie impossible"; } setTimeout(() => ($("copy").textContent = "Copier le lien"), 1500); };
$("fs").onclick = () => { const s = $("stage"); if (s.requestFullscreen) s.requestFullscreen(); else if ($("remote").webkitEnterFullscreen) $("remote").webkitEnterFullscreen(); };
</script>
</body>
